# v2 - secure settings
server.port=8082

# FIX-1: credentials come from environment variables, never from source code
spring.datasource.url=jdbc:mysql://localhost:3306/ju_health
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# FIX-10: never show messages, stack traces or binding errors to users
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
